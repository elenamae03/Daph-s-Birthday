<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Daph! 💚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts (optional: the page falls back to system fonts when offline) -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   THEME VARIABLES  (colors are also overridable from CONFIG.colors in the JS)
   ===================================================================== */
:root{
  --green:#4caf6d;
  --green-dark:#1f5a3a;
  --green-deep:#12331f;
  --green-light:#a5e6a8;
  --cream:#fff6dc;
  --pink:#f7b6c8;
  --brown:#7a4b2a;
  --ink:#17321f;
  --gold:#ffd75e;
  --font-display:'Fredoka','Nunito','Segoe UI',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --shadow-sm:0 4px 14px rgba(8,30,18,.22);
  --shadow:0 12px 32px rgba(8,30,18,.28);
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--green-deep)}
body{
  font-family:var(--font-body);color:var(--ink);
  font-size:clamp(16px,2.2vh,20px);line-height:1.45;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#app{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* =====================================================================
   SCENES  (only one is visible at a time; no page scrolling)
   ===================================================================== */
.scene{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:clamp(56px,8vh,70px) 14px 16px;text-align:center;
  overflow-x:hidden;overflow-y:auto;scrollbar-width:none;
  opacity:0;visibility:hidden;transform:scale(1.02);
  transition:opacity .6s ease,transform .6s ease,visibility 0s .6s;
  --tcolor:var(--cream);color:var(--cream);
}
.scene::-webkit-scrollbar{display:none}
.scene.active{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.stack{
  margin:auto;display:flex;flex-direction:column;align-items:center;
  gap:clamp(10px,2vh,18px);position:relative;z-index:2;
  width:100%;max-width:min(94vw,720px);
}
.scene h1[tabindex],.scene h2[tabindex]{outline:none}

.title{
  font-family:var(--font-display);font-weight:600;color:var(--tcolor);
  font-size:clamp(26px,min(5.4vh,7.6vw),52px);line-height:1.15;letter-spacing:.2px;
  text-shadow:0 3px 14px rgba(0,0,0,.28);
}
.sub{font-size:1.14em;max-width:36ch;line-height:1.45;font-weight:600}

/* ---------- soft card panel ---------- */
.panel{
  background:rgba(255,246,220,.97);color:var(--ink);margin:4px;
  padding:clamp(14px,2.4vh,24px) clamp(16px,3.2vw,28px);
  border-radius:var(--radius);box-shadow:var(--shadow);
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
  font-family:var(--font-display);font-weight:600;font-size:clamp(15px,2.1vh,18px);line-height:1.2;letter-spacing:.3px;
  color:var(--cream);background:linear-gradient(180deg,#2f7c52,var(--green-dark));border:0;cursor:pointer;
  padding:.8em 1.6em;min-height:46px;margin:6px;position:relative;border-radius:999px;
  box-shadow:0 6px 16px rgba(8,30,18,.3),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 10px 22px rgba(8,30,18,.34),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active{transform:translateY(1px);box-shadow:0 3px 8px rgba(8,30,18,.3)}
.btn.alt{background:linear-gradient(180deg,#fcc8d6,var(--pink));color:var(--ink)}
.btn.gold{background:linear-gradient(180deg,#ffe58a,var(--gold));color:var(--ink)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:default;pointer-events:none}
.btn:focus-visible,.song-btn:focus-visible,.gift-btn:focus-visible{
  outline:3px solid var(--gold);outline-offset:4px;
}
#startOver{
  position:fixed;top:12px;right:12px;z-index:50;margin:0;min-height:40px;
  font-size:14px;padding:.55em 1.1em;background:rgba(18,51,31,.85);backdrop-filter:blur(6px);
}
#wallNav{
  position:fixed;top:12px;left:12px;z-index:50;margin:0;min-height:40px;
  font-size:14px;padding:.55em 1.1em;background:rgba(18,51,31,.85);backdrop-filter:blur(6px);
}

/* ---------- decorations ---------- */
.sprite{display:block;width:100%;height:auto;overflow:visible}
.floaters,.twinkles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fl{position:absolute;opacity:.65;animation:bobup var(--d,8s) ease-in-out var(--dl,0s) infinite;
    color:#fff;font-family:var(--font-display)}
.tw{position:absolute;background:#fff;border-radius:50%;box-shadow:0 0 8px rgba(255,255,255,.8);animation:twinkle var(--d,2s) ease-in-out var(--dl,0s) infinite}
@keyframes bobup{
  0%{transform:translate(0,20px) rotate(-6deg);opacity:0}
  15%{opacity:.85}
  50%{transform:translate(10px,-14vh) rotate(6deg)}
  100%{transform:translate(-6px,-34vh) rotate(-4deg);opacity:0}
}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}
.checker{
  background-image:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.14),transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(255,255,255,.1),transparent 45%);
}
.bp{position:absolute;left:50%;top:50%;width:20px;pointer-events:none;z-index:9;
    animation:fly .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{
  0%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4) rotate(120deg);opacity:0}
}

/* =====================================================================
   SCENE 0 — COUNTDOWN
   ===================================================================== */
#s-countdown{background:linear-gradient(160deg,#6fcb8a,#2c8650)}
#s-countdown .title{font-size:clamp(24px,min(4.8vh,6.6vw),44px)}
.cd-date{font-family:var(--font-display);font-weight:700;font-size:clamp(40px,min(10vh,13vw),88px);line-height:1.1;color:var(--gold);text-shadow:0 4px 18px rgba(0,0,0,.3)}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,16px);width:min(94vw,520px);margin:4px 0}
.cd-box{background:rgba(255,246,220,.96);color:var(--ink);padding:clamp(12px,2.4vh,20px) 4px;border-radius:20px;box-shadow:var(--shadow-sm)}
.cd-num{display:block;font-family:var(--font-display);font-weight:600;font-size:clamp(28px,min(6.6vh,9vw),52px);line-height:1.1;font-variant-numeric:tabular-nums}
.cd-lab{display:block;font-family:var(--font-display);font-weight:500;font-size:clamp(11px,1.6vh,14px);letter-spacing:1.5px;margin-top:.3em;color:var(--green-dark)}
.cd-done{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,min(5vh,7vw),44px);line-height:1.25;color:var(--gold);text-shadow:0 3px 14px rgba(0,0,0,.3);max-width:22em}

/* =====================================================================
   SCENE 1 — GIFT
   ===================================================================== */
#s-gift{background:linear-gradient(160deg,#6fcb8a,#2c8650)}
#s-gift .title{font-size:clamp(30px,min(6.4vh,9vw),56px)}
.gift-btn{background:none;border:0;cursor:pointer;margin:6px;padding:0;border-radius:16px}
.gift{position:relative;width:12em;height:12.5em;font-size:min(2.1vh,4.4vw,20px)}
.gift-body,.gift-lid{position:absolute;box-shadow:0 .5em 1.2em rgba(0,0,0,.28)}
.gift-body{left:1em;bottom:.5em;width:10em;height:7.5em;border-radius:.6em;
  background:linear-gradient(135deg,#2f7f52,var(--green-dark));
  background-image:linear-gradient(90deg,transparent 4em,var(--cream) 4em,var(--cream) 6em,transparent 6em),linear-gradient(135deg,#2f7f52,var(--green-dark))}
.gift-lid{left:0;bottom:8em;width:12em;height:2.6em;border-radius:.6em;
  background:linear-gradient(135deg,#3b9264,#2a7248);
  background-image:linear-gradient(90deg,transparent 5em,var(--cream) 5em,var(--cream) 7em,transparent 7em),linear-gradient(135deg,#3b9264,#2a7248);
  transition:transform .8s cubic-bezier(.3,.7,.3,1),opacity .8s ease;z-index:2}
.gift-lid::before,.gift-lid::after{content:"";position:absolute;bottom:92%;width:3em;height:2.3em;background:var(--pink);
  border-radius:100% 100% 8% 100%;box-shadow:inset 0 -.25em .4em rgba(0,0,0,.12)}
.gift-lid::before{left:2.9em;transform:rotate(-12deg)}
.gift-lid::after{right:2.9em;transform:scaleX(-1) rotate(-12deg)}
.gift-glow{position:absolute;left:50%;bottom:6em;width:14em;height:14em;margin-left:-7em;border-radius:50%;
  background:radial-gradient(circle,rgba(255,244,170,.9),transparent 65%);opacity:0;transition:opacity .7s ease}
.gift.shake{animation:shake .65s ease-in-out}
.gift.open .gift-lid{transform:translateY(-6em) rotate(-16deg);opacity:0}
.gift.open .gift-glow{opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-.5em) rotate(-3deg)}40%{transform:translateX(.5em) rotate(3deg)}60%{transform:translateX(-.5em) rotate(-3deg)}80%{transform:translateX(.5em) rotate(3deg)}}
.gift-idle{animation:hop 2s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7em)}}

/* =====================================================================
   SCENE 2 — BIRTHDAY
   ===================================================================== */
#s-birthday{background:linear-gradient(#d6f6de,#8ad8a3 70%,#58b77b);--tcolor:var(--green-dark);color:var(--ink)}
#s-birthday .title{text-shadow:0 2px 10px rgba(255,255,255,.8)}
.bunting{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-around;z-index:1;
  border-top:3px solid rgba(23,50,31,.5);padding-top:0;pointer-events:none}
.bunting i{border-left:.9em solid transparent;border-right:.9em solid transparent;border-top:1.7em solid var(--c);font-size:min(2.2vh,4vw,18px);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.balloon{position:absolute;width:2.8em;height:3.4em;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7),transparent 30%),var(--c);z-index:1;font-size:min(2.6vh,5vw,22px);
  border-radius:50% 50% 50% 50%/55% 55% 45% 45%;box-shadow:inset -.3em -.4em .6em rgba(0,0,0,.12),0 6px 14px rgba(0,0,0,.12);
  animation:balloon 3.6s ease-in-out var(--dl,0s) infinite alternate;pointer-events:none}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:4em;background:rgba(23,50,31,.45);margin-top:0}
@keyframes balloon{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-1.1em) rotate(3deg)}}
.ground{position:absolute;left:0;right:0;bottom:0;height:7vh;min-height:36px;background:linear-gradient(#4aa86c,#3a8f58);border-radius:40% 40% 0 0/14px 14px 0 0;z-index:1}
.flowers{position:absolute;left:0;right:0;bottom:calc(max(7vh,36px) - 4px);display:flex;justify-content:space-around;z-index:1;pointer-events:none}
.flowers span{width:clamp(22px,4.5vh,36px)}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.confetti i{position:absolute;top:-12px;border-radius:30%;animation:confall var(--d,5s) linear var(--dl,0s) infinite}
@keyframes confall{to{transform:translateY(110vh) rotate(540deg)}}
.big-cake{font-size:clamp(46px,9vh,80px);line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}

/* =====================================================================
   SCENE 3 — CAKE
   ===================================================================== */
#s-cake{
  background:radial-gradient(circle at 50% 38%,rgba(255,220,140,.32),transparent 58%),
             linear-gradient(#2f7a4d,#1d5236);
}
.pips{display:flex;gap:8px}
.pips i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.22);transition:background .3s,transform .3s}
.pips i.on{background:var(--gold);transform:scale(1.2)}
.cake-stage{position:relative;width:20em;height:15em;font-size:min(2.35vh,4.4vw,21px);margin:2px 0 6px}
.cake-stage *{box-sizing:border-box}
.c-table{position:absolute;left:0;bottom:0;width:20em;height:2.4em;background:linear-gradient(#b07b4a,#8a5a34);border-radius:.8em .8em .4em .4em;box-shadow:0 .5em 1em rgba(0,0,0,.3)}
.c-plate{position:absolute;left:2.5em;bottom:2.1em;width:15em;height:1em;background:linear-gradient(#fff,#e7efe9);border-radius:50%;box-shadow:0 .2em .5em rgba(0,0,0,.25)}
.part{opacity:0}
.part.show{opacity:1;animation:dropin .8s cubic-bezier(.3,1.3,.5,1) both}
@keyframes dropin{0%{transform:translateY(-6em);opacity:0}70%{transform:translateY(.3em);opacity:1}100%{transform:none;opacity:1}}
.c-base,.c-layer2{position:absolute;height:3.2em;box-shadow:inset 0 -.5em .8em rgba(0,0,0,.08),0 .3em .6em rgba(0,0,0,.18)}
.c-base{left:3.5em;bottom:3em;width:13em;border-radius:1em .7em .8em .8em;background:linear-gradient(#f6dca0 0 38%,#fff3d6 38% 56%,#f6dca0 56%)}
.c-layer2{left:4.7em;bottom:6.1em;width:10.6em;border-radius:.9em .7em .6em .6em;background:linear-gradient(#f7c3cf 0 38%,#fff3d6 38% 56%,#f7c3cf 56%)}
.c-frost{position:absolute;inset:0;opacity:0;pointer-events:none}
.c-frost.show{opacity:1}
.c-frost i{position:absolute;background:linear-gradient(#b4ecba,#8fd99a);border-radius:999px;transform-origin:left center}
.c-frost.show i.cap{animation:spread .9s ease-out both}
.c-frost.show i.dr{transform-origin:top center;border-radius:0 0 999px 999px;animation:drip .7s ease-in .55s both}
.c-frost .cap1{left:3.2em;bottom:5.9em;width:13.6em;height:1.2em}
.c-frost .cap2{left:4.4em;bottom:8.9em;width:11.2em;height:1.2em}
@keyframes spread{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drip{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.c-top{position:absolute;left:0;bottom:0;width:1.4em;pointer-events:none;animation:topfall .6s cubic-bezier(.3,1.3,.5,1) both;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
@keyframes topfall{from{transform:translateY(-8em);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
.c-candles{position:absolute;inset:0;opacity:0;pointer-events:none}
.c-candles.show{opacity:1}
.candle{position:absolute;bottom:10em;width:.8em;height:2.2em;transform-origin:bottom;border-radius:.3em;
  background:repeating-linear-gradient(0deg,#fff 0 .35em,var(--pink) .35em .7em);isolation:isolate;box-shadow:0 .15em .3em rgba(0,0,0,.2)}
.c-candles.show .candle{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
.candle:nth-child(2){animation-delay:.2s!important}
.candle:nth-child(3){animation-delay:.4s!important}
@keyframes pop{from{transform:translateY(1.5em) scaleY(0)}to{transform:none}}
.flame{position:absolute;bottom:100%;left:50%;width:.8em;height:1.3em;margin-left:-.4em;opacity:0;transform:scale(0);transform-origin:bottom center;
  background:radial-gradient(ellipse at 50% 75%,#fff3a0,#ffb43a 55%,#ff7a2f);
  border-radius:50% 50% 50% 50%/65% 65% 35% 35%;transition:opacity .3s,transform .3s ease}
.c-candles.lit .flame{opacity:1;transform:scale(1);animation:flick .5s ease-in-out infinite alternate}
.c-candles.lit .candle::after{content:"";position:absolute;left:50%;bottom:100%;width:3.4em;height:3.4em;margin:0 0 -.7em -1.7em;z-index:-1;
  background:radial-gradient(circle,rgba(255,224,130,.6),transparent 65%);animation:glow 1.4s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.9,1.12) rotate(2deg)}}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.cake-hint{min-height:2.4em;max-width:34ch;font-weight:600}
.cake-done{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,3.2vh,28px);line-height:1.3;color:var(--gold);text-shadow:0 3px 12px rgba(0,0,0,.35)}
.wish-text{font-size:1.3em;max-width:34ch;color:#fff;min-height:2.4em;font-weight:600}
.dim{position:absolute;inset:0;background:rgba(5,15,10,.72);opacity:0;pointer-events:none;transition:opacity .9s ease;z-index:1}
#s-cake.dimmed .dim{opacity:1}
.wish-layer{position:absolute;inset:-3em -4em;pointer-events:none}
.wish-layer span{position:absolute;width:1.5em;animation:wishstar 1.8s ease-in-out var(--dl,0s) infinite alternate;opacity:0;filter:drop-shadow(0 0 .4em #ffe58a)}
.wish-layer.on span{opacity:1}
@keyframes wishstar{from{transform:scale(.7) translateY(.3em)}to{transform:scale(1.25) translateY(-.4em)}}

/* =====================================================================
   SCENE 4 — MUSIC CORNER
   ===================================================================== */
#s-music{background:radial-gradient(circle at 50% 100%,#2f7a4d,transparent 70%),linear-gradient(#143a26,#1b4a30)}
.eq{display:inline-flex;align-items:flex-end;gap:3px;height:24px;margin-left:12px;vertical-align:middle}
.eq i{width:5px;border-radius:3px;background:var(--green-light);animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{from{height:5px}to{height:24px}}
.mp{width:min(94vw,540px);display:flex;flex-direction:column;gap:clamp(8px,1.4vh,12px);align-items:stretch}
.songs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:38px;align-items:center}
.song-btn{font-family:var(--font-body);font-weight:700;font-size:.95em;line-height:1;background:#fff;color:var(--ink);border:0;cursor:pointer;
  padding:.65em 1.1em;min-height:38px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .15s,background .2s}
.song-btn:hover{transform:translateY(-1px)}
.song-btn[aria-current="true"]{background:var(--gold)}
.song-btn[aria-current="true"]::before{content:"▶ "}
.songs-empty{font-size:1.05em;color:var(--brown)}
.embed-box{position:relative;height:152px;background:#0d2417;display:flex;align-items:center;justify-content:center;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
.embed-box .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;color:var(--cream);font-size:1em;z-index:0}
.embed-box iframe{position:relative;z-index:1;width:100%;height:152px;border:0;display:block;border-radius:16px}
.embed-note{font-size:.82em;color:#5b6a58;line-height:1.35}
.mp-actions{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center}
.speaker{position:absolute;bottom:4vh;width:clamp(56px,9vw,100px);aspect-ratio:3/5;background:linear-gradient(#183626,#0e2216);z-index:1;pointer-events:none;border-radius:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:space-evenly}
.speaker::before,.speaker::after{content:"";width:60%;aspect-ratio:1;background:radial-gradient(circle,#4a8560 0 30%,#1b3d2a 31% 100%);border-radius:50%;animation:thump 1s ease-in-out infinite}
.speaker::after{width:40%;animation-delay:.3s}
@keyframes thump{50%{transform:scale(1.08)}}
.speaker.l{left:3vw}.speaker.r{right:3vw}
@media (max-width:760px){.speaker{display:none}}
@media (max-height:640px){.speaker,.eq{display:none}}

/* =====================================================================
   SCENE 6 — REVEAL
   ===================================================================== */
#s-reveal{background:radial-gradient(circle at 50% 30%,#1b3a2b,#0a1410 70%)}
.spot{position:absolute;top:0;left:50%;width:min(80vw,560px);height:85%;transform:translateX(-50%);z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,244,190,.38),rgba(255,244,190,.02));clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
.reveal-hint{font-family:var(--font-display);font-weight:500;font-size:1.5em;color:#c8e8cd;min-height:1.3em}
.reveal-stage{position:relative;width:20em;height:20em;font-size:min(2.1vh,4.4vw,17px)}
.pedestal{position:absolute;left:2em;bottom:.6em;width:16em;height:1.6em;background:linear-gradient(#35503f,#25382c);border-radius:.8em;box-shadow:0 -.3em 1.6em 0 rgba(255,244,190,.3),0 .5em 1em rgba(0,0,0,.4)}
.reveal-stage .gift{position:absolute;left:4em;bottom:1.7em;font-size:1em;transition:transform 1s ease,opacity 1s ease}
.figure{position:absolute;left:50%;bottom:2.4em;width:8em;margin-left:-4em;opacity:0;transform:translateY(55%) scale(.6);z-index:1;
  transition:transform 1.2s cubic-bezier(.3,1.2,.4,1),opacity .4s ease}
.reveal-stage .gift-body{z-index:3}
.reveal-stage.opened .figure{opacity:1;transform:translateY(-34%) scale(1)}
.reveal-stage.done .figure{transform:none}
.reveal-stage.done .gift{transform:translateY(40%);opacity:0}
.reveal-stage.done .figure{filter:drop-shadow(0 0 .8em rgba(255,244,190,.5));animation:float 3s ease-in-out 1s infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-.6em)}}
.reveal-msg{font-family:var(--font-display);font-weight:600;font-size:clamp(22px,min(4vh,5.6vw),36px);line-height:1.3;color:var(--gold);text-shadow:0 3px 14px rgba(0,0,0,.5);max-width:24em}
.reveal-sub{font-size:1.15em;color:#d9efdc;max-width:34ch;line-height:1.45;font-weight:600}
.reveal-text{display:flex;flex-direction:column;align-items:center;gap:10px;animation:fadein .9s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* =====================================================================
   SCENE 7 — FINAL MESSAGE
   ===================================================================== */
#s-final{background:linear-gradient(#c8f0d4,#7ccf97 75%,#4aa86c);--tcolor:var(--green-dark);color:var(--ink)}
.final-stack{max-width:min(96vw,900px)}
.final-row{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,30px);width:100%}
.figure-panel{background:linear-gradient(#1a3126,#14261c);flex:0 0 auto;padding:14px;position:relative;overflow:hidden}
.figure-panel .fig{width:clamp(70px,22vh,170px);position:relative}
.figure-panel::before{content:"";position:absolute;left:50%;top:0;width:120%;height:100%;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(255,244,190,.3),transparent);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);pointer-events:none}
.msg-panel{text-align:left;flex:1 1 auto;max-width:520px}
.msg-panel .title{color:var(--green-dark);text-shadow:none;font-size:clamp(24px,min(4.4vh,6vw),38px);margin-bottom:.5em}
.final-body{white-space:pre-line;font-size:clamp(16px,2.2vh,19px);line-height:1.55;font-weight:600}
@media (max-width:680px){
  .final-row{flex-direction:column;gap:8px}
  .figure-panel .fig{width:clamp(64px,15vh,120px)}
  .msg-panel{text-align:center}
}
.final-flowers{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;pointer-events:none;z-index:1}
.final-flowers span{width:clamp(18px,4vh,32px)}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .fl,.tw{animation:none!important;opacity:.5}
  .confetti{display:none}
}
.gift-photo{display:block;width:100%;height:auto;background:#fff;border-radius:18px;box-shadow:0 8px 22px rgba(0,0,0,.35)}

/* =====================================================================
   SCENE 8 — LETTERS FOR DAPH (message wall)
   ===================================================================== */
#s-wall{background:radial-gradient(circle at 50% 0,#eaf8e8,transparent 60%),linear-gradient(#c6e9cd,#98d1a8 70%,#72b98e);--tcolor:var(--green-dark);color:var(--ink)}
#s-wall .title{text-shadow:0 2px 10px rgba(255,255,255,.8)}
.wall-stack{max-width:min(96vw,960px)}
.wall-top{display:flex;flex-wrap:wrap;justify-content:center;gap:0 6px}
.wall-note{font-size:.95em;max-width:62ch;line-height:1.5;color:var(--ink)}
.wall-note b{color:var(--green-dark)}
.wish-form{width:min(94vw,560px);text-align:left;display:flex;flex-direction:column;gap:8px}
.wish-form label{font-family:var(--font-display);font-weight:600;font-size:.95em;letter-spacing:.5px;color:var(--green-dark)}
.wish-form input[type=text],.wish-form textarea{
  width:100%;font-family:var(--font-body);font-size:1em;line-height:1.45;color:var(--ink);background:#fff;border:2px solid rgba(31,90,58,.18);border-radius:14px;
  padding:.7em .9em;margin:2px 0;transition:border-color .2s,box-shadow .2s;
}
.wish-form textarea{resize:vertical;min-height:7.5em}
.wish-form input:focus-visible,.wish-form textarea:focus-visible{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(76,175,109,.25)}
.wish-count{font-family:var(--font-display);font-size:.85em;text-align:right;color:#5b6a58}
.wish-count.near{color:#b35a00}
.wish-count.full{color:#b3261e}
.form-err{min-height:1.2em;font-size:.95em;font-weight:700;color:#b3261e}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.wish-form .btn{align-self:center}
.wish-ok{width:min(94vw,560px);text-align:center;position:relative}
.wish-ok p{font-size:1.1em;line-height:1.45;margin-bottom:.6em;font-weight:600}
.wall-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;width:100%}
.wall-count{font-family:var(--font-display);font-weight:600;font-size:.95em;letter-spacing:1px;color:var(--green-dark)}
.wall-status{min-height:1.4em;font-size:1.05em;max-width:50ch;padding:6px 8px;font-weight:600}
.wall-status.err{color:#b3261e;font-weight:800}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:18px;width:100%;padding:6px 6px 20px;text-align:left}
.letter{position:relative;background:var(--cream);color:var(--ink);padding:18px 18px 14px;border-radius:18px;
  box-shadow:0 8px 22px rgba(8,30,18,.18);
  animation:fadein .6s ease both}
.letter .deco{position:absolute;top:12px;right:12px;width:24px;opacity:.9}
.letter .from{font-family:var(--font-display);font-weight:600;font-size:1em;line-height:1.4;color:var(--green-dark);padding-right:34px;overflow-wrap:anywhere;margin-bottom:.5em}
.letter .msg{font-size:1em;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.letter .when{margin-top:.8em;font-size:.85em;color:#6b4a30;text-align:right}
.wall-skel{height:110px;background:rgba(255,255,255,.4);border-radius:18px;animation:twinkle 1.4s ease-in-out infinite}
.wall-setup{text-align:left;max-width:56ch;font-size:1em;line-height:1.5}
</style>
</head>

<body>
<noscript><p style="padding:20px;color:#fff;font-family:monospace">This little gift needs JavaScript to open. 💚</p></noscript>

<main id="app">

  <!-- Small global "start over" button (hidden on the first and last scenes) -->
  <button class="btn small hidden" id="startOver" type="button" aria-label="Start over from the beginning">Start over</button>

  <!-- Floating link to the message wall (shown on scenes 2-7) -->
  <button class="btn small hidden" id="wallNav" type="button" aria-label="Open Letters for Daph, the birthday message wall">💌 Letters</button>

  <!-- =============== 0. COUNTDOWN =============== -->
  <section class="scene checker active" id="s-countdown" aria-labelledby="cdTitle">
    <div class="twinkles" data-n="36"></div>
    <div class="floaters" data-fl="heart,star" data-n="14"></div>
    <div class="stack">
      <h1 class="title" id="cdTitle" tabindex="-1" data-focus data-text="cdTitle"></h1>
      <div class="cd-date" id="cdDate"></div>
      <div id="cdTimer">
        <div class="cd-grid" role="timer" aria-live="off" aria-label="Time left until the birthday">
          <div class="cd-box"><span class="cd-num" id="cdD">--</span><span class="cd-lab">DAYS</span></div>
          <div class="cd-box"><span class="cd-num" id="cdH">--</span><span class="cd-lab">HOURS</span></div>
          <div class="cd-box"><span class="cd-num" id="cdM">--</span><span class="cd-lab">MINS</span></div>
          <div class="cd-box"><span class="cd-num" id="cdS">--</span><span class="cd-lab">SECS</span></div>
        </div>
        <p class="sub" style="margin:.6em auto 0" data-text="cdSub"></p>
      </div>
      <h2 class="cd-done hidden" id="cdDone" data-text="cdDone"></h2>
      <button class="btn gold hidden" id="btnCdOpen" type="button">Open your gift</button>
      <button class="btn alt" id="btnCdWall" type="button">Leave a birthday wish</button>
    </div>
  </section>

  <!-- =============== 1. OPENING GIFT =============== -->
  <section class="scene checker" id="s-gift" aria-labelledby="giftTitle">
    <div class="twinkles" data-n="36"></div>
    <div class="floaters" data-fl="heart,star" data-n="14"></div>
    <div class="stack">
      <h1 class="title" id="giftTitle" tabindex="-1" data-focus data-text="giftHi"></h1>
      <p class="sub" data-text="giftSub"></p>
      <button class="gift-btn" id="giftBtn" type="button" aria-label="The gift box. Click to open it.">
        <div class="gift gift-idle" id="gift">
          <div class="gift-glow"></div>
          <div class="gift-lid"></div>
          <div class="gift-body"></div>
        </div>
      </button>
      <button class="btn gold" id="btnOpenGift" type="button">Open your gift</button>
    </div>
  </section>

  <!-- =============== 2. BIRTHDAY GREETING =============== -->
  <section class="scene" id="s-birthday" aria-labelledby="bdayTitle">
    <div class="bunting" id="bunting" aria-hidden="true"></div>
    <span class="balloon" style="--c:#ff8fab;left:4%;top:20%;--dl:0s" aria-hidden="true"></span>
    <span class="balloon" style="--c:#ffd75e;left:14%;top:38%;--dl:-1s" aria-hidden="true"></span>
    <span class="balloon" style="--c:#9be29f;right:4%;top:22%;--dl:-.5s" aria-hidden="true"></span>
    <span class="balloon" style="--c:#8fd3ff;right:14%;top:40%;--dl:-1.6s" aria-hidden="true"></span>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="flowers" id="bdayFlowers" aria-hidden="true"></div>
    <div class="ground" aria-hidden="true"></div>
    <div class="stack">
      <div class="big-cake" aria-hidden="true">🎂</div>
      <div class="panel">
        <h1 class="title" id="bdayTitle" tabindex="-1" data-focus data-text="bdayTitle"></h1>
        <p class="sub" style="margin:.7em auto 0" data-text="bdaySub"></p>
      </div>
      <button class="btn gold" id="btnCelebrate" type="button">Let's celebrate!</button>
    </div>
  </section>

  <!-- =============== 3. CAKE BUILDING =============== -->
  <section class="scene" id="s-cake" aria-labelledby="cakeTitle">
    <div class="twinkles" data-n="26"></div>
    <div class="dim" aria-hidden="true"></div>
    <div class="stack">
      <h2 class="title" id="cakeTitle" tabindex="-1" data-focus data-text="cakeTitle"></h2>
      <div class="pips" id="pips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

      <div class="cake-stage" id="cakeStage" role="img" aria-label="An empty plate on a table, waiting for a cake">
        <div class="c-table"></div>
        <div class="c-plate"></div>
        <div class="part c-base" id="p-base"></div>
        <div class="part c-layer2" id="p-layer2"></div>
        <div class="c-frost" id="p-frost">
          <i class="cap cap1"></i><i class="cap cap2"></i>

          <i class="dr" style="left:7.4em;bottom:4.9em;width:.9em;height:1.1em"></i>
          <i class="dr" style="left:11.6em;bottom:4.6em;width:.9em;height:1.4em"></i>
          <i class="dr" style="left:15.3em;bottom:4.9em;width:.9em;height:1.1em"></i>
          <i class="dr" style="left:4.9em;bottom:7.6em;width:.9em;height:1.5em"></i>
          <i class="dr" style="left:8.9em;bottom:7.9em;width:.9em;height:1.1em"></i>
          <i class="dr" style="left:12.4em;bottom:7.6em;width:.9em;height:1.5em"></i>
          <i class="dr" style="left:14.4em;bottom:7.9em;width:.9em;height:1.1em"></i>
        </div>
        <div id="p-top"></div>
        <div class="c-candles" id="p-candles">
          <b class="candle" style="left:8.2em"><u class="flame"></u></b>
          <b class="candle" style="left:9.65em"><u class="flame"></u></b>
          <b class="candle" style="left:11.1em"><u class="flame"></u></b>
        </div>
        <div class="wish-layer" id="wishLayer" aria-hidden="true"></div>
      </div>

      <p class="cake-hint" id="cakeHint"></p>
      <h3 class="cake-done hidden" id="cakeDone" data-text="cakeDone"></h3>
      <p class="wish-text hidden" id="wishText" data-text="wish" aria-live="polite"></p>

      <div>
        <button class="btn" id="btnCakeStep" type="button"></button>
        <button class="btn alt hidden" id="btnWish" type="button">Make a wish ✨</button>
        <button class="btn gold hidden" id="btnCakeNext" type="button">Next surprise</button>
      </div>
    </div>
  </section>

  <!-- =============== 4. MUSIC CORNER =============== -->
  <section class="scene" id="s-music" aria-labelledby="musicTitle">
    <div class="floaters" id="noteFloaters" data-fl="note" data-n="12"></div>
    <div class="speaker l" aria-hidden="true"></div>
    <div class="speaker r" aria-hidden="true"></div>

    <div class="twinkles" data-n="44"></div>

    <div class="twinkles" data-n="24"></div>
    <div class="floaters" data-fl="heart,star" data-n="16"></div>

          <p class="final-body" data-text="finalBody"></p>
        </div>
      </div>
      <div class="wall-top">
        <button class="btn alt" id="btnToWall" type="button">Letters for Daph</button>
        <button class="btn gold" id="btnReplay" type="button">Replay the whole surprise</button>
      </div>
    </div>
  </section>

  <!-- =============== 8. LETTERS FOR DAPH (MESSAGE WALL) =============== -->
  <section class="scene" id="s-wall" aria-labelledby="wallTitle">
    <div class="twinkles" data-n="22"></div>
    <div class="floaters" data-fl="heart,star" data-n="12"></div>
    <div class="stack wall-stack">
      <h1 class="title" id="wallTitle" tabindex="-1" data-focus data-text="wallTitle"></h1>
      <p class="sub" data-text="wallSub"></p>

      <div class="panel"><p class="wall-note" data-text="wallNotice"></p></div>

      <form class="panel wish-form" id="wishForm" novalidate>
        <label for="wName">YOUR NAME *</label>
        <input type="text" id="wName" name="name" maxlength="40" required autocomplete="name" placeholder="Your name">
        <label for="wMsg">YOUR BIRTHDAY MESSAGE *</label>
        <textarea id="wMsg" name="message" maxlength="300" rows="5" required placeholder="Write something kind for Daph…"></textarea>
        <div class="wish-count" id="wCount" aria-live="polite">0 / 300</div>
        <div class="hp" aria-hidden="true"><label>Leave this empty <input type="text" id="wHp" tabindex="-1" autocomplete="off"></label></div>
        <p class="form-err" id="wErr" role="alert"></p>
        <button class="btn gold" id="wSubmit" type="submit">Send Birthday Wish 💚</button>
      </form>

      <div class="panel wish-ok hidden" id="wOk" role="status" tabindex="-1">
        <p data-text="wallOk"></p>
        <p style="font-size:1em;color:#6b4a30" data-text="wallOkNote"></p>
        <button class="btn alt" id="btnWriteAnother" type="button">Write another</button>
      </div>

      <div class="wall-bar">
        <span class="wall-count" id="wallCount"></span>
        <button class="btn" id="btnWallRefresh" type="button">↻ Refresh wishes</button>
      </div>
      <p class="wall-status" id="wallStatus" role="status" aria-live="polite"></p>
      <div class="wall-grid" id="wallGrid"></div>

      <div class="wall-top">
        <button class="btn gold" id="btnWallBack" type="button">← Back</button>
      </div>
    </div>
  </section>

</main>

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const rnd = (a,b) => Math.random()*(b-a)+a;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, ms));
const fillName = t => t.replace(/\{NAME\}/g, CONFIG.name.toUpperCase()).replace(/\{name\}/g, CONFIG.name);

/* ---- apply theme colors ---- */
(function applyTheme(){
  const c = CONFIG.colors, root = document.documentElement.style;
  root.setProperty('--green', c.green);       root.setProperty('--green-dark', c.greenDark);
  root.setProperty('--green-deep', c.greenDeep); root.setProperty('--green-light', c.greenLight);
  root.setProperty('--cream', c.cream);       root.setProperty('--pink', c.pink);
  root.setProperty('--brown', c.brown);
})();

/* ---- fill all [data-text] elements from CONFIG.messages ---- */
$$('[data-text]').forEach(el => { el.textContent = fillName(CONFIG.messages[el.dataset.text] || ''); });

/* =====================================================================
   DECORATION BUILDERS
   ===================================================================== */
const HEART_COLORS = ['#ffffff','#f7b6c8','#ffd75e','#a5e6a8'];
function buildFloaters(el){
  const kinds = el.dataset.fl.split(','), n = +el.dataset.n || 10;
  el.innerHTML = '';
  for(let i=0;i<n;i++){
    const s = document.createElement('span'); s.className = 'fl';
    s.style.left = rnd(0,96)+'%'; s.style.bottom = rnd(-6,62)+'%';
    s.style.setProperty('--d', rnd(7,13)+'s'); s.style.setProperty('--dl', -rnd(0,12)+'s');
    const kind = kinds[i % kinds.length], c = HEART_COLORS[i % HEART_COLORS.length], w = Math.round(rnd(14,28));
    if(kind==='note'){ s.textContent = ['♪','♫','♩','♬'][i%4]; s.style.fontSize = w+'px'; }
    else { s.style.width = w+'px'; s.innerHTML = kind==='heart' ? heartSVG(c) : starSVG(c); }
    el.appendChild(s);
  }
}
function buildTwinkles(el){
  const n = +el.dataset.n || 20; el.innerHTML='';
  for(let i=0;i<n;i++){
    const s = document.createElement('i'); s.className='tw'; const z = Math.random()<.3?6:4;
    s.style.cssText = `left:${rnd(0,98)}%;top:${rnd(0,98)}%;width:${z}px;height:${z}px;--d:${rnd(1.4,3.2)}s;--dl:${-rnd(0,3)}s`;
    el.appendChild(s);
  }
}
function buildBunting(){
  const b = $('#bunting'), cols = ['#ff8fab','#ffd75e','#ffffff','#9be29f','#8fd3ff'];
  const n = Math.max(8, Math.round(window.innerWidth/52));
  b.innerHTML = ''; for(let i=0;i<n;i++){ const t=document.createElement('i'); t.style.setProperty('--c',cols[i%cols.length]); b.appendChild(t); }
}
function buildFlowerRow(el,n){
  const cols = ['#f7b6c8','#ffffff','#ffd75e','#ff8fab'];
  el.innerHTML=''; for(let i=0;i<n;i++){ const s=document.createElement('span'); s.innerHTML=flowerSVG(cols[i%cols.length]); el.appendChild(s); }
}
function startConfetti(){
  if(reduceMotion) return;
  const host = $('#confetti'), cols = ['#ff8fab','#ffd75e','#ffffff','#9be29f','#8fd3ff'];
  host.innerHTML='';
  for(let i=0;i<38;i++){
    const c = document.createElement('i'), z = Math.round(rnd(6,11));
    c.style.cssText = `left:${rnd(0,100)}%;width:${z}px;height:${z}px;background:${cols[i%cols.length]};--d:${rnd(4,8)}s;--dl:${-rnd(0,8)}s`;
    host.appendChild(c);
  }
}
function stopConfetti(){ $('#confetti').innerHTML=''; }
function burst(host, n=14){
  if(reduceMotion) return;
  for(let i=0;i<n;i++){
    const p = document.createElement('span'); p.className='bp';
    const a = rnd(0,Math.PI*2), d = rnd(60,150);
    p.style.setProperty('--dx', Math.cos(a)*d+'px'); p.style.setProperty('--dy', Math.sin(a)*d-40+'px');
    p.innerHTML = i%2 ? heartSVG(HEART_COLORS[i%4]) : starSVG('#ffd75e');
    host.appendChild(p); setTimeout(()=>p.remove(), 1100);
  }
}

/* =====================================================================
   SCENE ENGINE
   ===================================================================== */
const ORDER = ['s-countdown','s-gift','s-birthday','s-cake','s-music','s-reveal','s-final','s-wall'];
const S = {}; ORDER.forEach((id,i)=>{ S[id.slice(2)] = i; });
const scenes = ORDER.map(id => document.getElementById(id));
let current = 0, musicReady = false;

/* ---- countdown lock ---- */
const cdTarget = new Date(CONFIG.countdown.target).getTime();
const previewMode = /[?&]preview\b/.test(location.search);
const isLocked = () => !previewMode && Date.now() < cdTarget;
const homeScene = () => isLocked() ? S.countdown : S.gift;

function goTo(i){
  const prev = current; current = i;
  scenes.forEach((s,k)=>{ s.classList.toggle('active', k===i); s.inert = (k!==i); s.setAttribute('aria-hidden', k!==i ? 'true':'false'); });
  $('#startOver').classList.toggle('hidden', !(i>=S.birthday && i<=S.reveal));
  $('#wallNav').classList.toggle('hidden', !(i>=S.birthday && i<=S.final));
  if(prev===S.birthday && i!==S.birthday) stopConfetti();
  if(i===S.birthday){ buildBunting(); startConfetti(); }
  if(i===S.music && !musicReady){ renderMusic(); musicReady = true; }
  if(i===S.wall) loadWishes();
  scenes[i].scrollTop = 0;
  const f = scenes[i].querySelector('[data-focus]');
  if(f) setTimeout(()=>f.focus({preventScroll:true}), 60);
}

/* =====================================================================
   SCENE 0 — COUNTDOWN
   ===================================================================== */
$('#cdDate').textContent = CONFIG.countdown.label;
const pad2 = n => String(n).padStart(2,'0');
function tickCountdown(){
  const ms = cdTarget - Date.now(), over = ms <= 0;
  if(!over){
    const t = Math.floor(ms/1000);
    $('#cdD').textContent = Math.floor(t/86400);
    $('#cdH').textContent = pad2(Math.floor(t%86400/3600));
    $('#cdM').textContent = pad2(Math.floor(t%3600/60));
    $('#cdS').textContent = pad2(t%60);
  }
  $('#cdTimer').classList.toggle('hidden', over);
  $('#cdDone').classList.toggle('hidden', !over);
  $('#btnCdOpen').classList.toggle('hidden', !(over || previewMode));
}
tickCountdown(); setInterval(tickCountdown, 1000);
$('#btnCdOpen').addEventListener('click', ()=>goTo(S.gift));
$('#btnCdWall').addEventListener('click', ()=>{ wallReturn = S.countdown; goTo(S.wall); });

/* =====================================================================
   SCENE 1 — GIFT
   ===================================================================== */
let giftBusy = false;
async function openGift(){
  if(giftBusy) return; giftBusy = true;
  const gift = $('#gift'); $('#btnOpenGift').disabled = true;
  gift.classList.remove('gift-idle'); gift.classList.add('shake');
  await wait(reduceMotion?50:650);
  gift.classList.remove('shake'); gift.classList.add('open'); burst(gift.parentElement, 18);
  await wait(reduceMotion?100:1500);
  goTo(S.birthday); giftBusy = false;
}
$('#btnOpenGift').addEventListener('click', openGift);
$('#giftBtn').addEventListener('click', openGift);
$('#btnCelebrate').addEventListener('click', ()=>goTo(S.cake));

/* =====================================================================
   SCENE 3 — CAKE BUILDING
   ===================================================================== */
const cakeScene = $('#s-cake'), stage = $('#cakeStage');
const btnStep = $('#btnCakeStep'), btnWish = $('#btnWish'), btnCakeNext = $('#btnCakeNext');
let cakeStep = 0, cakeBusy = false;
const TOPPINGS = [ // [left em, bottom em, kind]
  [5.0,9.9,'heart'],[12.9,9.9,'star'],[6.5,9.9,'berry'],[14.2,9.9,'heart'],[3.5,6.8,'star'],[15.6,6.8,'berry']
];
const STAGE_LABELS = [
  'An empty plate on a table, waiting for a cake','A cake base on a plate','A two-layer cake','A two-layer cake with green frosting',
  'A frosted cake with heart, star and strawberry toppings','A frosted cake with three candles','A birthday cake with three lit candles'
];
function updateCakeUI(){
  $$('#pips i').forEach((p,k)=>p.classList.toggle('on', k<cakeStep));
  stage.setAttribute('aria-label', STAGE_LABELS[cakeStep]);
  if(cakeStep < CONFIG.cakeSteps.length){
    btnStep.textContent = CONFIG.cakeSteps[cakeStep].label;
    $('#cakeHint').textContent = CONFIG.cakeSteps[cakeStep].hint;
    btnStep.classList.remove('hidden');
  }
}
async function doCakeStep(){
  if(cakeBusy || cakeStep >= CONFIG.cakeSteps.length) return;
  cakeBusy = true; btnStep.disabled = true;
  const n = cakeStep;
  if(n===0) $('#p-base').classList.add('show');
  if(n===1) $('#p-layer2').classList.add('show');
  if(n===2) $('#p-frost').classList.add('show');
  if(n===3){
    const host = $('#p-top');
    for(const [l,b,k] of TOPPINGS){
      const t = document.createElement('span'); t.className='c-top'; t.style.left=l+'em'; t.style.bottom=b+'em';
      t.innerHTML = k==='heart' ? heartSVG(Math.random()<.5?'#e8445a':'#f7b6c8') : k==='star' ? starSVG('#ffd75e') : berrySVG();
      host.appendChild(t); await wait(reduceMotion?20:300);
    }
  }
  if(n===4) $('#p-candles').classList.add('show');
  if(n===5) $('#p-candles').classList.add('lit');
  await wait(reduceMotion?30:(n===3?500:850));
  cakeStep++; updateCakeUI(); cakeBusy = false; btnStep.disabled = false;
  if(cakeStep >= CONFIG.cakeSteps.length){ // cake finished
    btnStep.classList.add('hidden'); $('#cakeHint').textContent='';
    $('#cakeDone').classList.remove('hidden'); btnWish.classList.remove('hidden'); btnWish.focus({preventScroll:true});
  }
}
async function makeWish(){
  btnWish.disabled = true; cakeScene.classList.add('dimmed');
  const layer = $('#wishLayer'); layer.innerHTML='';
  for(let i=0;i<12;i++){
    const a = (i/12)*Math.PI*2, s = document.createElement('span');
    s.style.left = (50+Math.cos(a)*46)+'%'; s.style.top = (45+Math.sin(a)*46)+'%'; s.style.setProperty('--dl',(i%4)*.25+'s');
    s.innerHTML = starSVG(i%2?'#ffe58a':'#ffffff'); layer.appendChild(s);
  }
  layer.classList.add('on');
  await wait(reduceMotion?50:900);
  $('#cakeDone').classList.add('hidden'); $('#wishText').classList.remove('hidden');
  await wait(reduceMotion?50:2600);
  cakeScene.classList.remove('dimmed'); btnWish.classList.add('hidden');
  btnCakeNext.classList.remove('hidden'); btnCakeNext.focus({preventScroll:true});
}
btnStep.addEventListener('click', doCakeStep);
btnWish.addEventListener('click', makeWish);
btnCakeNext.addEventListener('click', ()=>goTo(S.music));
function resetCake(){
  cakeStep = 0; cakeBusy = false;
  $$('.show',stage).forEach(e=>e.classList.remove('show')); $('#p-candles').classList.remove('lit');
  $('#p-top').innerHTML=''; $('#wishLayer').innerHTML=''; $('#wishLayer').classList.remove('on');
  cakeScene.classList.remove('dimmed');
  $('#cakeDone').classList.add('hidden'); $('#wishText').classList.add('hidden');
  btnWish.classList.add('hidden'); btnWish.disabled=false; btnCakeNext.classList.add('hidden');
  btnStep.disabled=false; btnStep.classList.remove('hidden'); updateCakeUI();
}

/* =====================================================================
   SCENE 4 — MUSIC CORNER (one playlist, Spotify embeds)
   ===================================================================== */
let mSong = 0;
const listEl = $('#songList'), boxEl = $('#embedBox'), phEl = $('#embedPh'), spotBtn = $('#spotOpen'), noteEl = $('#embedNote');
const PL = CONFIG.playlist;
const usePlaylistEmbed = () => /open\.spotify\.com\/playlist\//.test(PL.spotifyPlaylistUrl || '');

// open.spotify.com/track/ID  ->  open.spotify.com/embed/track/ID  (same for playlists)
const toEmbedUrl = url => url.replace(/open\.spotify\.com\/(track|playlist)\//, 'open.spotify.com/embed/$1/');

function renderSongs(){
  listEl.innerHTML='';
  listEl.classList.toggle('hidden', usePlaylistEmbed());
  if(usePlaylistEmbed()) return;
  if(!PL.songs.length){
    const p = document.createElement('span'); p.className='songs-empty'; p.textContent = 'The playlist is coming soon 💚'; listEl.appendChild(p); return;
  }
  PL.songs.forEach((s,i)=>{
    const b = document.createElement('button'); b.type='button'; b.className='song-btn'; b.textContent = (i+1)+'. '+s.title;
    b.setAttribute('aria-current', String(i===mSong));
    b.addEventListener('click', ()=>selectSong(i)); listEl.appendChild(b);
  });
}
function renderEmbed(){
  $$('iframe',boxEl).forEach(f=>f.remove());
  const whole = usePlaylistEmbed();
  const url = whole ? PL.spotifyPlaylistUrl : (PL.songs[mSong] || {}).url;
  const label = whole ? PL.name : (PL.songs[mSong] || {}).title;
  const h = whole ? 352 : 152;
  boxEl.style.height = h + 'px';
  if(!url){
    phEl.textContent = 'The playlist is coming soon 💚';
    spotBtn.setAttribute('aria-disabled','true'); spotBtn.removeAttribute('href'); spotBtn.tabIndex=-1; return;
  }
  phEl.textContent = '🎧 Loading the player… If nothing appears, use the Spotify button below.';
  spotBtn.removeAttribute('aria-disabled'); spotBtn.tabIndex=0; spotBtn.href = url;
  spotBtn.setAttribute('aria-label','Open '+label+' in Spotify (opens in a new tab)');
  const f = document.createElement('iframe');
  f.src = toEmbedUrl(url);
  f.title = 'Spotify player: '+label;
  f.width='100%'; f.height=String(h); f.style.height = h+'px'; f.loading='lazy'; f.setAttribute('frameborder','0');
  f.allow = 'encrypted-media; clipboard-write; fullscreen; picture-in-picture';
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.setAttribute('sandbox','allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-presentation');
  f.addEventListener('error', ()=>{ phEl.textContent = "The player couldn't load. Please use the Spotify button below. 💚"; });
  boxEl.appendChild(f);
}
function selectSong(i){ mSong = i; renderSongs(); renderEmbed(); }
spotBtn.addEventListener('click', e=>{ if(spotBtn.getAttribute('aria-disabled')==='true') e.preventDefault(); });
function updateOnline(){
  noteEl.textContent = navigator.onLine
    ? "The Spotify player needs an internet connection. If it doesn't show up, use the Spotify button below."
    : "You seem to be offline. Connect to the internet to play songs here.";
}
window.addEventListener('online', updateOnline); window.addEventListener('offline', updateOnline);
function renderMusic(){ updateOnline(); renderSongs(); renderEmbed(); }
function resetMusic(){
  mSong = 0; musicReady = false;
  $$('iframe',boxEl).forEach(f=>f.remove()); // also stops any song that is playing
}
$('#btnMusicNext').addEventListener('click', ()=>{ resetRevealOnly(); goTo(S.reveal); });

/* =====================================================================
   SCENE 6 — REVEAL
   ===================================================================== */
const revealStage = $('#revealStage'), btnOpenBox = $('#btnOpenBox');
let revealBusy = false;
function resetRevealOnly(){
  revealBusy = false; revealStage.classList.remove('opened','done'); $('#giftR').classList.remove('open','shake');
  $('#revealText').classList.add('hidden'); btnOpenBox.classList.remove('hidden'); btnOpenBox.disabled=false;
  $('#revealHint').classList.remove('hidden');
}
async function openBox(){
  if(revealBusy) return; revealBusy = true; btnOpenBox.disabled = true;
  const g = $('#giftR'); g.classList.add('shake'); await wait(reduceMotion?50:650);
  g.classList.remove('shake'); g.classList.add('open'); revealStage.classList.add('opened'); burst(revealStage, 20);
  await wait(reduceMotion?100:1500);
  revealStage.classList.add('done'); btnOpenBox.classList.add('hidden'); $('#revealHint').classList.add('hidden');
  await wait(reduceMotion?50:900);
  $('#revealText').classList.remove('hidden'); $('#btnToFinal').focus({preventScroll:true});
}
btnOpenBox.addEventListener('click', openBox);
$('#btnToFinal').addEventListener('click', ()=>goTo(S.final));


/* =====================================================================
   SCENE 8 — LETTERS FOR DAPH (Supabase message wall)
   Reads approved wishes from the `wishes` table and sends new ones through
   the `submit_wish` database function (rate-limited, validated, held for review).
   Only the public anon key is used here. See SETUP.md.
   ===================================================================== */
const WALL_MAX_NAME = 40, WALL_MAX_MSG = 300;
let wallReturn = S.final, wallLoading = false, wallSending = false;
const wForm = $('#wishForm'), wName = $('#wName'), wMsg = $('#wMsg'), wHp = $('#wHp'), wErr = $('#wErr'),
      wCount = $('#wCount'), wSubmit = $('#wSubmit'), wOk = $('#wOk'),
      wGrid = $('#wallGrid'), wStatus = $('#wallStatus'), wRefresh = $('#btnWallRefresh'), wTotal = $('#wallCount');

// Accepts https://xxxx.supabase.co and also forgives a pasted /rest/v1/ suffix or trailing slashes.
const sbClean = () => String((CONFIG.supabase||{}).url||'').trim().replace(/\/rest\/v1\/?$/i,'').replace(/\/+$/,'');
function wallConfigured(){
  const s = CONFIG.supabase || {};
  return /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(sbClean()) && !!s.anonKey && !/PASTE_YOUR/i.test(s.anonKey);
}
const sbBase = () => sbClean();
function sbHeaders(){
  const k = CONFIG.supabase.anonKey, h = { apikey:k, 'Content-Type':'application/json' };
  if(k.startsWith('eyJ')) h.Authorization = 'Bearer ' + k;   // legacy JWT anon key; new publishable keys use apikey only
  return h;
}
async function sbFetch(path, opts={}){
  const ctrl = new AbortController(), t = setTimeout(()=>ctrl.abort(), 12000);
  try{ return await fetch(sbBase()+path, Object.assign({ headers:sbHeaders(), signal:ctrl.signal, cache:'no-store' }, opts)); }
  finally{ clearTimeout(t); }
}
const cleanText = t => String(t||'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
const LINK_RE = /(https?:\/\/|www\.|\b[a-z0-9-]+\.(com|net|org|ru|xyz|top|io|me|ly|gg|ph)\b)/i;

function setWallStatus(kind){
  wStatus.className = 'wall-status';
  wStatus.textContent = '';
  if(kind==='loading'){ wStatus.textContent = '🎧 Loading birthday wishes…'; }
  else if(kind==='empty'){ wStatus.textContent = CONFIG.messages.wallEmpty; }
  else if(kind==='error'){ wStatus.classList.add('err'); wStatus.textContent = CONFIG.messages.wallError; }
  else if(kind==='setup'){
    wStatus.classList.add('wall-setup');
    wStatus.textContent = 'The message wall is not connected to a database yet. The site owner needs to finish the Supabase setup (see SETUP.md) before wishes can be sent or shown.';
  }
}
function showSkeletons(){
  wGrid.innerHTML = '';
  for(let i=0;i<3;i++){ const d = document.createElement('div'); d.className='wall-skel'; d.setAttribute('aria-hidden','true'); wGrid.appendChild(d); }
}
function decoFor(id){
  let h = 0; const str = String(id);
  for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
  const pal = ['#f7b6c8','#ffd75e','#ffffff','#a5e6a8'];
  const k = h % 3, c = pal[(h>>3) % pal.length];
  return k===0 ? flowerSVG(c) : k===1 ? heartSVG(c==='#ffffff' ? '#f7b6c8' : c) : starSVG('#ffd75e');
}
function fmtDate(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  try{ return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }); }
  catch(e){ return d.toDateString(); }
}
function renderWishes(rows){
  wGrid.innerHTML = '';
  if(!rows.length){ wTotal.textContent=''; setWallStatus('empty'); return; }
  setWallStatus('');
  wTotal.textContent = rows.length + (rows.length===1 ? ' WISH' : ' WISHES');
  rows.forEach((r, idx)=>{
    const card = document.createElement('article'); card.className = 'letter';
    card.style.animationDelay = Math.min(idx,12)*60 + 'ms';
    const deco = document.createElement('span'); deco.className='deco'; deco.setAttribute('aria-hidden','true');
    deco.innerHTML = decoFor(r.id);                       // built only from our own sprite strings
    const from = document.createElement('div'); from.className='from'; from.textContent = 'From ' + String(r.name||'').slice(0,WALL_MAX_NAME);
    const msg  = document.createElement('p');   msg.className='msg';   msg.textContent  = String(r.message||'').slice(0,WALL_MAX_MSG);
    const when = document.createElement('div'); when.className='when'; when.textContent = fmtDate(r.created_at);
    card.append(deco, from, msg, when); wGrid.appendChild(card);   // textContent only: submitted text is never parsed as HTML
  });
}
async function loadWishes(){
  if(wallLoading) return;
  if(!wallConfigured()){ wGrid.innerHTML=''; wTotal.textContent=''; setWallStatus('setup'); wSubmit.disabled = true; return; }
  wSubmit.disabled = wallSending;
  wallLoading = true; wRefresh.disabled = true; setWallStatus('loading'); showSkeletons();
  try{
    const r = await sbFetch('/rest/v1/wishes?select=id,name,message,created_at&order=created_at.desc&limit=100');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json();
    if(!Array.isArray(rows)) throw new Error('Bad response');
    renderWishes(rows);
  }catch(e){
    wGrid.innerHTML=''; wTotal.textContent=''; setWallStatus('error');
  }finally{ wallLoading = false; wRefresh.disabled = false; }
}

function updateCount(){
  const n = wMsg.value.length;
  wCount.textContent = n + ' / ' + WALL_MAX_MSG;
  wCount.className = 'wish-count' + (n>=WALL_MAX_MSG ? ' full' : n>=WALL_MAX_MSG-40 ? ' near' : '');
}
wMsg.addEventListener('input', updateCount);

function friendlyError(body){
  const m = (body && (body.message||'')) + '';
  if(m.includes('rate_limited'))  return 'Lots of wishes are coming in! Please wait a few minutes and try again. 💚';
  if(m.includes('links_not_allowed')) return 'Please leave out links and web addresses.';
  if(m.includes('invalid'))       return 'Please check your name and message and try again.';
  return "Your wish couldn't be sent right now. Please try again in a moment.";
}
wForm.addEventListener('submit', async ev=>{
  ev.preventDefault(); if(wallSending) return;
  wErr.textContent = '';
  const name = cleanText(wName.value), message = cleanText(wMsg.value);
  if(!name){ wErr.textContent='Please add your name.'; wName.focus(); return; }
  if(name.length > WALL_MAX_NAME){ wErr.textContent='Name is too long.'; wName.focus(); return; }
  if(message.length < 2){ wErr.textContent='Please write a birthday message.'; wMsg.focus(); return; }
  if(message.length > WALL_MAX_MSG){ wErr.textContent='Message is too long.'; wMsg.focus(); return; }
  if(LINK_RE.test(name) || LINK_RE.test(message)){ wErr.textContent='Please leave out links and web addresses.'; return; }
  if(!wallConfigured()){ wErr.textContent='The message wall is not connected to a database yet.'; return; }
  try{ const last = +localStorage.getItem('daphWishLast')||0; if(Date.now()-last < 30000){ wErr.textContent='Please wait a few seconds before sending another wish.'; return; } }catch(e){}
  if(wHp.value){ showWishOk(); return; }               // honeypot tripped: pretend success, send nothing
  wallSending = true; wSubmit.disabled = true; wSubmit.textContent = 'Sending…';
  try{
    const r = await sbFetch('/rest/v1/rpc/submit_wish', { method:'POST', body: JSON.stringify({ p_name:name, p_message:message, p_website:wHp.value }) });
    if(!r.ok){ let b=null; try{ b = await r.json(); }catch(e){} throw { body:b }; }
    try{ localStorage.setItem('daphWishLast', String(Date.now())); }catch(e){}   // convenience only, not real storage
    wForm.reset(); updateCount(); showWishOk();
  }catch(e){
    wErr.textContent = (e && e.body) ? friendlyError(e.body) : "Your wish couldn't be sent. Please check your connection and try again.";
  }finally{ wallSending = false; wSubmit.disabled = !wallConfigured(); wSubmit.textContent = 'Send Birthday Wish 💚'; }
});
function showWishOk(){ wForm.classList.add('hidden'); wOk.classList.remove('hidden'); wOk.focus({preventScroll:true}); burst(wOk, 14); }
function resetWall(){ wOk.classList.add('hidden'); wForm.classList.remove('hidden'); wErr.textContent=''; }
$('#btnWriteAnother').addEventListener('click', ()=>{ resetWall(); wName.focus(); });
wRefresh.addEventListener('click', loadWishes);
$('#wallNav').addEventListener('click', ()=>{ wallReturn = current; goTo(S.wall); });
$('#btnToWall').addEventListener('click', ()=>{ wallReturn = S.final; goTo(S.wall); });
$('#btnWallBack').addEventListener('click', ()=>goTo(wallReturn));
updateCount();

   RESET / REPLAY

function resetAll(){
  giftBusy = false;
  const gift = $('#gift'); gift.classList.remove('open','shake'); gift.classList.add('gift-idle'); $('#btnOpenGift').disabled = false;
  resetCake(); resetMusic(); resetRevealOnly(); stopConfetti(); resetWall();
  goTo(homeScene());
}
$('#btnReplay').addEventListener('click', resetAll);
$('#startOver').addEventListener('click', resetAll);

$$('.twinkles').forEach(buildTwinkles);
buildFlowerRow($('#bdayFlowers'), 9);

$('#figureReveal').innerHTML = figureHTML();
$('#figureFinal').innerHTML = figureHTML();
